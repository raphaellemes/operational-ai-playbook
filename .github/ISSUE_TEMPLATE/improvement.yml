name: Improvement
description: Suggest an improvement to docs, templates, diagrams, or demos.
title: "Improve: "
labels: ["enhancement"]
body:
  - type: textarea
    id: improvement
    attributes:
      label: Improvement
      description: What should be improved?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why would this make the playbook more useful?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - README
        - Docs
        - Templates
        - Examples
        - Demo
        - Governance
        - Translation
        - Other
    validations:
      required: true

